<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Эмблема шиномонтажа — колесо">
  <defs>
    <radialGradient id="hub" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3a3f48"/>
      <stop offset="100%" stop-color="#1b1d22"/>
    </radialGradient>
  </defs>

  <!-- внешний протекторный обод -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#ff7a1a" stroke-width="5"/>
  <g stroke="#ff7a1a" stroke-width="4" stroke-linecap="round">
    <!-- насечки протектора -->
    <g id="tread">
      <line x1="60" y1="2" x2="60" y2="12"/>
    </g>
    <use href="#tread" transform="rotate(30 60 60)"/>
    <use href="#tread" transform="rotate(60 60 60)"/>
    <use href="#tread" transform="rotate(90 60 60)"/>
    <use href="#tread" transform="rotate(120 60 60)"/>
    <use href="#tread" transform="rotate(150 60 60)"/>
    <use href="#tread" transform="rotate(180 60 60)"/>
    <use href="#tread" transform="rotate(210 60 60)"/>
    <use href="#tread" transform="rotate(240 60 60)"/>
    <use href="#tread" transform="rotate(270 60 60)"/>
    <use href="#tread" transform="rotate(300 60 60)"/>
    <use href="#tread" transform="rotate(330 60 60)"/>
  </g>

  <!-- диск/ступица -->
  <circle cx="60" cy="60" r="34" fill="url(#hub)" stroke="#ff7a1a" stroke-width="2"/>

  <!-- спицы -->
  <g stroke="#ff7a1a" stroke-width="3" stroke-linecap="round">
    <line x1="60" y1="60" x2="60" y2="32" transform="rotate(0 60 60)"/>
    <line x1="60" y1="60" x2="60" y2="32" transform="rotate(72 60 60)"/>
    <line x1="60" y1="60" x2="60" y2="32" transform="rotate(144 60 60)"/>
    <line x1="60" y1="60" x2="60" y2="32" transform="rotate(216 60 60)"/>
    <line x1="60" y1="60" x2="60" y2="32" transform="rotate(288 60 60)"/>
  </g>

  <circle cx="60" cy="60" r="10" fill="#14161a" stroke="#ff7a1a" stroke-width="2"/>
</svg>
